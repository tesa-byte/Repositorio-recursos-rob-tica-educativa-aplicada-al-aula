<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositorio Unificado de Robótica Educativa</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --badge-infantil: #ec4899;
      --badge-primaria: #8b5cf6;
      --badge-secundaria: #10b981;
      --badge-general: #3b82f6;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px;
    }

    .app-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    @media (max-width: 868px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Panel de Filtros Lateral */
    .filters-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      height: fit-content;
    }

    .filter-group {
      margin-bottom: 20px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-title {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.938rem;
      color: var(--text-main);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    /* Buscador Superior y Grilla */
    .search-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-bar-container {
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 8px 16px;
      box-shadow: var(--shadow);
    }

    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      color: var(--text-main);
    }

    .results-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Grilla de Tarjetas */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-infantil { background-color: var(--badge-infantil); }
    .badge-primaria { background-color: var(--badge-primaria); }
    .badge-secundaria { background-color: var(--badge-secundaria); }
    .badge-general { background-color: var(--badge-general); }

    .institution-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.75rem;
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .card-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .btn-details {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
      display: inline-block;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-details:hover {
      background-color: var(--primary-dark);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Repositorio de Robótica y Pensamiento Computacional</h1>
      <p>Catálogo unificado de Castilla-La Mancha y repositorios oficiales</p>
    </header>

    <div class="main-content">
      <!-- Panel de Filtros Lateral -->
      <aside class="filters-sidebar">
        <div class="filter-group">
          <div class="filter-title">Ámbito Territorial</div>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="ambito" value="autonomico" checked> Autonómico (JCCM / CE 4.0)</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="ambito" value="nacional" checked> Nacional (INTEF / EDIA)</label>
        </div>

        <div class="filter-group">
          <div class="filter-title">Etapa Educativa</div>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="etapa" value="infantil" checked> Infantil (3-6 años)</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="etapa" value="primaria" checked> Primaria (6-12 años)</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="etapa" value="secundaria" checked> Secundaria (12-18 años)</label>
        </div>

        <div class="filter-group">
          <div class="filter-title">Hardware / Dispositivo</div>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="hardware" value="tangible" checked> Tangible (Bee-Bot / Blue-Bot)</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="hardware" value="mbot" checked> mBot / mBot2 / LEGO</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="hardware" value="microbit" checked> BBC micro:bit</label>
          <label class="checkbox-label"><input type="checkbox" class="filter-cb" data-type="hardware" value="scratch" checked> Scratch / Makey Makey</label>
        </div>
      </aside>

      <!-- Zona de Búsqueda y Resultados -->
      <main class="search-section">
        <div class="search-bar-container">
          <span style="color: var(--text-muted);">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar por palabra clave, sensor o tecnología (ej. mBot2, salud, Bee-Bot, micro:bit)...">
        </div>

        <div class="results-count" id="resultsCount">Cargando catálogo unificado...</div>

        <!-- Grilla de Tarjetas -->
        <div class="cards-grid" id="cardsGrid"></div>
      </main>
    </div>
  </div>

  <script>
    // BASE DE DATOS LOCAL OFICIAL DE CASTILLA-LA MANCHA Y PROYECTOS CLAVE
    const recursosBase = [
      {
        id: "CLM-001",
        titulo: "Caja de Aprendizaje: Viaje al interior de la mente con mBot2",
        descripcion: "Recurso didáctico estructurado en retos para explorar sensores, síntesis de voz, conectividad Wi-Fi e Inteligencia Artificial.",
        etapa: "secundaria",
        ambito: "autonomico",
        hardware: "mbot",
        institucion: "JCCM / eXE",
        tags: ["mBot2", "IA", "Wi-Fi", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/exelearningresource/caja-de-aprendizaje-viaje-al-interior-de-la-mente/5f7832af-2e06-2ef5-20b0-4c9b18643a15"
      },
      {
        id: "CLM-002",
        titulo: "Caja de Aprendizaje: Salud y micro:bit",
        descripcion: "Propuesta en formato de caja de aprendizaje para resolver retos sobre salud física, registro de pulsaciones y hábitos saludables.",
        etapa: "secundaria",
        ambito: "autonomico",
        hardware: "microbit",
        institucion: "JCCM / eXE",
        tags: ["micro:bit V2", "Salud", "Sensores", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/exelearningresource/caja-de-aprendizaje-salud-y-microbit/d50c86e8-7d98-2222-f68f-dd054d4328fd"
      },
      {
        id: "CLM-003",
        titulo: "Misión Basura Cero en los Bosques (mBot2)",
        descripcion: "Situación de aprendizaje del Servicio de Innovación de CLM para programar mBot2 en la clasificación de residuos naturales.",
        etapa: "primaria",
        ambito: "autonomico",
        hardware: "mbot",
        institucion: "JCCM / Innovación",
        tags: ["mBot2", "ODS 15", "Sostenibilidad", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/recurso/mision-basura-cero-en-los-bosques/81a9b36d-2e03-4939-9e66-0c4f8a64a64c"
      },
      {
        id: "CLM-004",
        titulo: "Actividades con Blue-Bot en Educación Especial",
        descripcion: "Fichero de actividades adaptadas para alumnado con necesidades educativas especiales utilizando Blue-Bot para autonomía urbana.",
        etapa: "infantil",
        ambito: "autonomico",
        hardware: "tangible",
        institucion: "JCCM / Inclusión",
        tags: ["Blue-Bot", "Inclusión", "DUA", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/exelearningresource/actividades-con-blue-bot-en-educacion-especial/7e314706-9647-cc01-7831-d3caabcb4887"
      },
      {
        id: "CLM-005",
        titulo: "Micro:bit: Atrapa la pelota",
        descripcion: "Propuesta práctica para introducir acelerómetros, sensores de inclinación y pantallas matriciales LED en Educación Primaria.",
        etapa: "primaria",
        ambito: "autonomico",
        hardware: "microbit",
        institucion: "JCCM / Primaria",
        tags: ["micro:bit", "Acelerómetro", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/recurso/microbit-atrapa-la-pelota/33ccc87c-40de-4a8a-8395-9721629be889"
      },
      {
        id: "CLM-006",
        titulo: "Un viaje al pasado - Situación de Aprendizaje",
        descripcion: "Experiencia interdisciplinar que conecta Conocimiento del Medio con orientación espacial y programación de robots de suelo.",
        etapa: "infantil",
        ambito: "autonomico",
        hardware: "tangible",
        institucion: "JCCM / eXE",
        tags: ["Bee-Bot", "Orientación", "LOMLOE", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/exelearningresource/un-viaje-al-pasado/df31ccde-33c1-510c-a373-50846689f7ba"
      },
      {
        id: "CLM-007",
        titulo: "Crea tu propia orquesta (Makey Makey)",
        descripcion: "Construcción de superficies conductivas e instrumentos musicales interactivos con materiales cotidianos y Makey Makey.",
        etapa: "primaria",
        ambito: "autonomico",
        hardware: "scratch",
        institucion: "JCCM / Música",
        tags: ["Makey Makey", "Música", "Scratch", "JCCM"],
        url: "https://bancoderecursos.castillalamancha.es/recurso/crea-tu-propia-orquesta/740becd2-bb9d-470a-adf8-bf5983d7f0fb"
      },
      {
        id: "INT-001",
        titulo: "Aprendiendo a programar con mBot",
        descripcion: "Guía de aula del Ministerio de Educación para el trabajo con motores, sensores de ultrasonidos e infrarrojos en Primaria.",
        etapa: "primaria",
        ambito: "nacional",
        hardware: "mbot",
        institucion: "Code.INTEF",
        tags: ["mBot", "Code.INTEF", "Sensórica"],
        url: "https://code.intef.es/prop_didacticas/aprendiendo-a-programar-con-mbot/"
      },
      {
        id: "INT-002",
        titulo: "Explorando robots en el aula",
        descripcion: "REA oficial centrado en la iniciación a la robótica de suelo con Bee-Bot/Blue-Bot y diseño de itinerarios interdisciplinares.",
        etapa: "infantil",
        ambito: "nacional",
        hardware: "tangible",
        institucion: "Code.INTEF",
        tags: ["Blue-Bot", "Botonera", "Espacialidad"],
        url: "https://code.intef.es/prop_didacticas/explorando-robots-en-el-aula/"
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const cardsGrid = document.getElementById('cardsGrid');
      const resultsCount = document.getElementById('resultsCount');
      const filterCBs = document.querySelectorAll('.filter-cb');

      let apiResources = [];

      function stripHTML(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return doc.body.textContent || "";
      }

      function detectEtapa(text) {
        const lower = text.toLowerCase();
        if (lower.includes('infantil') || lower.includes('3-6') || lower.includes('bee-bot') || lower.includes('blue-bot')) return 'infantil';
        if (lower.includes('primaria') || lower.includes('lego') || lower.includes('scratch') || lower.includes('mbot')) return 'primaria';
        if (lower.includes('secundaria') || lower.includes('eso') || lower.includes('python') || lower.includes('arduino')) return 'secundaria';
        return 'general';
      }

      function detectHardware(text) {
        const lower = text.toLowerCase();
        if (lower.includes('bee-bot') || lower.includes('blue-bot') || lower.includes('tangible')) return 'tangible';
        if (lower.includes('micro:bit') || lower.includes('microbit')) return 'microbit';
        if (lower.includes('mbot') || lower.includes('lego') || lower.includes('spike')) return 'mbot';
        if (lower.includes('scratch') || lower.includes('makey')) return 'scratch';
        return 'mbot';
      }

      // FUNCIÓN CLAVE: FILTRADO SÍNCRONO QUE RESPONDE AL INSTANTE
      function executeFiltering() {
        const query = searchInput.value.toLowerCase().trim();

        // Leer casillas seleccionadas de la barra lateral
        const selectedAmbitos = Array.from(document.querySelectorAll('.filter-cb[data-type="ambito"]:checked')).map(cb => cb.value);
        const selectedEtapas = Array.from(document.querySelectorAll('.filter-cb[data-type="etapa"]:checked')).map(cb => cb.value);
        const selectedHardware = Array.from(document.querySelectorAll('.filter-cb[data-type="hardware"]:checked')).map(cb => cb.value);

        // Unificar todo el catálogo
        const todoElCatalogo = [...recursosBase, ...apiResources];

        // Aplicar reglas estrictas de filtrado
        const filtrados = todoElCatalogo.filter(item => {
          const matchAmbito = selectedAmbitos.includes(item.ambito);
          const matchEtapa = selectedEtapas.includes(item.etapa) || item.etapa === 'general';
          const matchHardware = selectedHardware.includes(item.hardware);

          const fullText = `${item.titulo} ${item.descripcion} ${item.tags.join(' ')} ${item.institucion}`.toLowerCase();
          const matchQuery = query === '' || fullText.includes(query);

          return matchAmbito && matchEtapa && matchHardware && matchQuery;
        });

        renderCards(filtrados);
      }

      function renderCards(recursos) {
        cardsGrid.innerHTML = '';

        if (recursos.length === 0) {
          cardsGrid.innerHTML = `
            <div class="no-results">
              No se han encontrado situaciones de aprendizaje que coincidan con los filtros seleccionados.
            </div>`;
          resultsCount.textContent = 'Mostrando 0 recursos indexados';
          return;
        }

        recursos.forEach(item => {
          const cardHTML = `
            <article class="card" onclick="window.open('${item.url}', '_blank')">
              <div>
                <div class="card-header">
                  <span class="badge badge-${item.etapa}">${item.etapa}</span>
                  <span class="institution-tag">${item.institucion}</span>
                </div>
                <h2 class="card-title">${item.titulo}</h2>
                <p class="card-description">${item.descripcion}</p>
                <div class="card-tags">
                  ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
              </div>
              <div class="card-footer">
                <a href="${item.url}" target="_blank" class="btn-details" onclick="event.stopPropagation()">
                  Abrir Recurso Oficial ↗
                </a>
              </div>
            </article>
          `;
          cardsGrid.innerHTML += cardHTML;
        });

        resultsCount.textContent = `Mostrando ${recursos.length} recursos indexados`;
      }

      // Consulta de API externa en segundo plano sin bloquear
      async function fetchExternalAPI(term) {
        if (!term || term.length < 3) return;
        try {
          const response = await fetch(`https://code.intef.es/wp-json/wp/v2/posts?search=${encodeURIComponent(term)}&per_page=6`);
          if (!response.ok) return;
          const data = await response.json();

          apiResources = data.map(post => ({
            id: `intef-${post.id}`,
            titulo: stripHTML(post.title.rendered),
            descripcion: stripHTML(post.excerpt.rendered).substring(0, 140) + '...',
            etapa: detectEtapa(post.title.rendered + " " + post.excerpt.rendered),
            ambito: 'nacional',
            hardware: detectHardware(post.title.rendered + " " + post.excerpt.rendered),
            institucion: 'Code.INTEF',
            tags: ['Code.INTEF', 'Oficial', 'REA'],
            url: post.link
          }));

          executeFiltering(); // Re-filtrar una vez descargados los datos de la API
        } catch (e) {
          console.warn("API externa no disponible:", e);
        }
      }

      // VINCULAR EVENTOS INSTANTÁNEOS
      filterCBs.forEach(cb => {
        cb.addEventListener('change', executeFiltering);
      });

      searchInput.addEventListener('input', () => {
        executeFiltering(); // Filtra la base de datos local al instante
        const val = searchInput.value.trim();
        if (val.length > 2) {
          fetchExternalAPI(val); // Trae más recursos externos en segundo plano
        }
      });

      // Carga inicial directa
      executeFiltering();
    });
  </script>
</body>
</html>
