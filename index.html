<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Global de Robótica Educativa - Multi-API</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --badge-infantil: #ec4899;
      --badge-primaria: #8b5cf6;
      --badge-secundaria: #10b981;
      --badge-general: #3b82f6;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px;
    }

    .app-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    @media (max-width: 868px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Panel de Filtros Lateral */
    .filters-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      height: fit-content;
    }

    .filter-group {
      margin-bottom: 20px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-title {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.938rem;
      color: var(--text-main);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    /* Buscador Superior y Grilla */
    .search-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-bar-container {
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 8px 16px;
      box-shadow: var(--shadow);
    }

    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      color: var(--text-main);
    }

    .results-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Grilla de Tarjetas */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-infantil { background-color: var(--badge-infantil); }
    .badge-primaria { background-color: var(--badge-primaria); }
    .badge-secundaria { background-color: var(--badge-secundaria); }
    .badge-general { background-color: var(--badge-general); }

    .institution-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.75rem;
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .card-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .btn-details {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
      display: inline-block;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-details:hover {
      background-color: var(--primary-dark);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Repositorio Federado de Robótica Educativa</h1>
      <p>Búsqueda asíncrona en tiempo real conectada a múltiples APIs institucionales y abiertas</p>
    </header>

    <div class="main-content">
      <!-- Panel de Fuentes Activables -->
      <aside class="filters-sidebar">
        <div class="filter-group">
          <div class="filter-title">Fuentes Públicas Activas</div>
          <label class="checkbox-label"><input type="checkbox" class="api-toggle" value="intef" checked> Code.INTEF (Ministerio)</label>
          <label class="checkbox-label"><input type="checkbox" class="api-toggle" value="edia" checked> CEDEC / Proyecto EDIA</label>
          <label class="checkbox-label"><input type="checkbox" class="api-toggle" value="wikimedia" checked> Wikimedia Educational API</label>
        </div>

        <div class="filter-group">
          <div class="filter-title">Filtro Rápido por Etapa</div>
          <label class="checkbox-label"><input type="checkbox" class="etapa-filter" value="infantil" checked> Infantil</label>
          <label class="checkbox-label"><input type="checkbox" class="etapa-filter" value="primaria" checked> Primaria</label>
          <label class="checkbox-label"><input type="checkbox" class="etapa-filter" value="secundaria" checked> Secundaria</label>
        </div>
      </aside>

      <!-- Zona de Búsqueda y Resultados -->
      <main class="search-section">
        <div class="search-bar-container">
          <span style="color: var(--text-muted);">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar en todas las fuentes simultáneamente (ej. micro:bit, algoritmo, Scratch, sensor)...">
        </div>

        <div class="results-count" id="resultsCount">Cargando repositorios federados...</div>

        <!-- Grilla Unificada -->
        <div class="cards-grid" id="cardsGrid"></div>
      </main>
    </div>
  </div>

  <!-- MOTOR MULTI-API ASÍNCRONO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const cardsGrid = document.getElementById('cardsGrid');
      const resultsCount = document.getElementById('resultsCount');
      const apiToggles = document.querySelectorAll('.api-toggle');
      const etapaFilters = document.querySelectorAll('.etapa-filter');

      let debounceTimer;

      // Auxiliar para limpiar etiquetas HTML de las respuestas API
      function stripHTML(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return doc.body.textContent || "";
      }

      // Auxiliar para inferir etapa según el texto
      function detectEtapa(text) {
        const lower = text.toLowerCase();
        if (lower.includes('infantil') || lower.includes('3-6') || lower.includes('bee-bot')) return 'infantil';
        if (lower.includes('primaria') || lower.includes('lego') || lower.includes('scratch')) return 'primaria';
        if (lower.includes('secundaria') || lower.includes('eso') || lower.includes('python') || lower.includes('arduino')) return 'secundaria';
        return 'general';
      }

      // 1. CONECTOR API 1: Code.INTEF
      async function fetchCodeINTEF(term) {
        const response = await fetch(`https://code.intef.es/wp-json/wp/v2/posts?search=${encodeURIComponent(term)}&per_page=10`);
        if (!response.ok) throw new Error('Error al conectar con INTEF');
        const data = await response.json();
        return data.map(post => ({
          id: `intef-${post.id}`,
          titulo: stripHTML(post.title.rendered),
          descripcion: stripHTML(post.excerpt.rendered).substring(0, 140) + '...',
          url: post.link,
          fuente: 'Code.INTEF',
          etapa: detectEtapa(post.title.rendered + " " + post.excerpt.rendered),
          tags: ['Ministerio', 'Oficial', 'REA']
        }));
      }

      // 2. CONECTOR API 2: CEDEC / Proyecto EDIA
      async function fetchCEDEC(term) {
        const response = await fetch(`https://cedec.intef.es/wp-json/wp/v2/posts?search=${encodeURIComponent(term)}&per_page=10`);
        if (!response.ok) throw new Error('Error al conectar con CEDEC');
        const data = await response.json();
        return data.map(post => ({
          id: `cedec-${post.id}`,
          titulo: stripHTML(post.title.rendered),
          descripcion: stripHTML(post.excerpt.rendered).substring(0, 140) + '...',
          url: post.link,
          fuente: 'Proyecto EDIA / CEDEC',
          etapa: detectEtapa(post.title.rendered + " " + post.excerpt.rendered),
          tags: ['eXeLearning', 'REA', 'DUA']
        }));
      }

      // 3. CONECTOR API 3: Wikimedia Commons Educational Media API
      async function fetchWikimedia(term) {
        const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=robotics%20education%20${encodeURIComponent(term)}&gsrnamespace=6&prop=imageinfo&iiprop=url|extmetadata&format=json&origin=*`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Error al conectar con Wikimedia');
        const data = await response.json();
        
        if (!data.query || !data.query.pages) return [];

        return Object.values(data.query.pages).slice(0, 6).map(page => {
          const info = page.imageinfo ? page.imageinfo[0] : {};
          return {
            id: `wiki-${page.pageid}`,
            titulo: page.title.replace('File:', ''),
            descripcion: 'Esquema visual, modelo o diagrama educativo de código abierto de la base Wikimedia.',
            url: info.descriptionurl || 'https://commons.wikimedia.org',
            fuente: 'Wikimedia Commons',
            etapa: 'general',
            tags: ['Diagrama', 'Open Content', 'CC']
          };
        });
      }

      // FUNCION PRINCIPAL MULTI-SEARCH ASÍNCRONA
      async function executeMultiSearch(term = 'robotica') {
        cardsGrid.innerHTML = '<div class="no-results">🔄 Consultado simultáneamente en fuentes oficiales...</div>';
        resultsCount.textContent = 'Enviando peticiones paralelas a las APIs...';

        const activeSources = Array.from(apiToggles).filter(cb => cb.checked).map(cb => cb.value);
        const promises = [];

        if (activeSources.includes('intef')) promises.push(fetchCodeINTEF(term));
        if (activeSources.includes('edia')) promises.push(fetchCEDEC(term));
        if (activeSources.includes('wikimedia')) promises.push(fetchWikimedia(term));

        // Ejecutar todas las promesas en paralelo garantizando tolerancia a fallos
        const results = await Promise.allSettled(promises);

        let combinedResources = [];
        results.forEach(result => {
          if (result.status === 'fulfilled' && Array.isArray(result.value)) {
            combinedResources = combinedResources.concat(result.value);
          }
        });

        // Aplicar filtrado por etapa local
        const selectedEtapas = Array.from(etapaFilters).filter(cb => cb.checked).map(cb => cb.value);
        const filtered = combinedResources.filter(res => selectedEtapas.includes(res.etapa) || res.etapa === 'general');

        renderCards(filtered);
      }

      // Dibujar los resultados devueltos por la federación de APIs
      function renderCards(recursos) {
        cardsGrid.innerHTML = '';

        if (!recursos || recursos.length === 0) {
          cardsGrid.innerHTML = `
            <div class="no-results">
              No se han encontrado resultados combinados en las fuentes seleccionadas.
            </div>`;
          resultsCount.textContent = 'Mostrando 0 recursos indexados';
          return;
        }

        recursos.forEach(item => {
          const cardHTML = `
            <article class="card" onclick="window.open('${item.url}', '_blank')">
              <div>
                <div class="card-header">
                  <span class="badge badge-${item.etapa}">${item.etapa}</span>
                  <span class="institution-tag">${item.fuente}</span>
                </div>
                <h2 class="card-title">${item.titulo}</h2>
                <p class="card-description">${item.descripcion}</p>
                <div class="card-tags">
                  ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
              </div>
              <div class="card-footer">
                <a href="${item.url}" target="_blank" class="btn-details" onclick="event.stopPropagation()">
                  Abrir en ${item.fuente} ↗
                </a>
              </div>
            </article>
          `;
          cardsGrid.innerHTML += cardHTML;
        });

        resultsCount.textContent = `Se han unificado ${recursos.length} recursos de fuentes institucionales en directo`;
      }

      // Listeners con debounce
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const val = e.target.value.trim();
        debounceTimer = setTimeout(() => {
          executeMultiSearch(val.length > 0 ? val : 'robotica');
        }, 500);
      });

      apiToggles.forEach(cb => cb.addEventListener('change', () => executeMultiSearch(searchInput.value.trim() || 'robotica')));
      etapaFilters.forEach(cb => cb.addEventListener('change', () => executeMultiSearch(searchInput.value.trim() || 'robotica')));

      // Carga inicial
      executeMultiSearch('robotica');
    });
  </script>
</body>
</html>
